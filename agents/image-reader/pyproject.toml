[project]
name = "image-reader"
version = "0.1.0"
description = "Toy vision agent: describes an image and extracts its visible text using Gemini."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
]

[project.scripts]
image-reader = "image_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_reader"]
